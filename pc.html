  function switchSlide2() {
    // CSSを動的に生成する

      #notification {

        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      #notification button {
        color: #e6e6fa;

        background-image: url('https://raw.githubusercontent.com/akaina0112/Test/82c44afa420b29c80bc691dfc8f7753b05a0f82a/cat.gif');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        animation: catWalk 5s linear infinite;
      }

      #notification button:hover {
        opacity: 0.8;
      }

      @keyframes catWalk {
        0% { background-position: left top; }
        100% { background-position: right top; }
      }
    `;
    document.head.appendChild(style);

    // HTMLを動的に生成する
    const notification = document.createElement('div');
    notification.id = 'notification';
    notification.innerHTML = `
      <span id="notification-message"></span><br>
      <span id="notification-message2"></span><br>
      <button id="notification-close">OK</button>
    `;
    document.body.appendChild(notification);

    // JavaScriptを動的に生成する
    // キーボードショートカットの無効化
    document.addEventListener('keydown', function(event) {
      if (event.ctrlKey && (event.key === 'u' || event.key === 's' || event.key === 'p')) {
        event.preventDefault();
        showNotification('このショートカットは無効化されています。');
      }
    });

    // 右クリックの無効化
    document.addEventListener('contextmenu', function(event) {
      event.preventDefault();
      showRightClickNotification('右クリックは無効化されています。');
    });

    // 通知を表示する関数（ショートカット無効化用）
    function showNotification(message) {
      const notification = document.getElementById('notification');
      const notificationMessage = notification.querySelector('#notification-message');
      const notificationMessage2 = notification.querySelector('#notification-message2');
      notificationMessage.textContent = message;
      notificationMessage2.textContent = 'This shortcut has been disabled.';
      notification.style.display = 'block';
      notification.style.top = '20px';
    }

    // 通知を表示する関数（右クリック無効化用）
    function showRightClickNotification(message) {
      const notification = document.getElementById('notification');
      const notificationMessage = notification.querySelector('#notification-message');
      const notificationMessage2 = notification.querySelector('#notification-message2');
      notificationMessage.textContent = message;
      notificationMessage2.textContent = 'Right click is disabled.';
      notification.style.display = 'block';
      notification.style.top = '20px';
      
    }

    // OKボタンをクリックしたときの処理
    document.getElementById('notification-close').addEventListener('click', function() {
      const notification = document.getElementById('notification');
      notification.style.top = '-100px';
      setTimeout(() => {
        notification.style.display = 'none';
      }, 510);
    });
    // 左クリックが押されたときの処理
document.addEventListener('mousedown', function(event) {
  if (event.button === 0) {  // 0 は左クリックを意味する
    const notification = document.getElementById('notification');

    setTimeout(() => {

    }, 510);  // 510ms後に非表示にする
  }
});

    function changeLink(id) {
  const link = links[id];
  if (!link) return;

  const specialUrl = "https://akaina0112.github.io/music/open/black.html";

  // モーダル要素取得
  const modal = document.getElementById('confirmationModal');
  const modalMessage = document.getElementById('modalMessage');
  const confirmBtn = document.getElementById('confirmButton');
  const cancelBtn = document.getElementById('cancelButton');

  function showModal(message, onConfirm, onCancel) {
    modalMessage.innerText = message;
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';

    confirmBtn.onclick = () => {
      onConfirm();
      closeModal();
    };
    cancelBtn.onclick = () => {
      onCancel();
      closeModal();
    };
  }

  function closeModal() {
    modal.style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  // row6の場合、まず特別リンク確認モーダルを表示
  if (id === "row6") {
    showModal(
      `特別リンク「黒い約束」を開いてもよろしいですか？`,
      () => {
        // はい → 特別リンク開く
        window.open(specialUrl, '_blank');
      },
      () => {
        // いいえ → YouTubeタイトル取得して通常の確認モーダルへ
        fetchYouTubeTitleAndShowModal(link.url);
      }
    );
  } else {
    // row6以外は普通にYouTubeタイトル取得して確認モーダル
    fetchYouTubeTitleAndShowModal(link.url);
  }

  // YouTubeのタイトルを取得して確認モーダル表示する関数
  function fetchYouTubeTitleAndShowModal(youtubeUrl) {
    const videoId = youtubeUrl.split('v=')[1];
    const apiKey = 'AIzaSyAB_eMk1rBDeKGuahQgDAweiKVvt2dtiX0'; // APIキー
    const apiUrl = `https://www.googleapis.com/youtube/v3/videos?id=${videoId}&key=${apiKey}&part=snippet`;

    fetch(apiUrl)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(data => {
        const title = data.items[0].snippet.title;
        showModal(
          `このリンクを開いてもよろしいですか？\nタイトル: ${title}`,
          () => window.open(youtubeUrl, '_blank'),
          () => { /* キャンセル時は何もしない */ }
        );
      })
      .catch(error => {
        console.error('Error fetching YouTube video title:', error);
        alert('タイトルの取得に失敗しました。');
      });
  }
}

function closeModal() {
  document.getElementById('confirmationModal').style.display = 'none';
  document.body.style.overflow = 'auto';
}




    function createTable() {
      if (tableCreated) return; // すでにテーブルが作成されている場合は何もしない
      tableCreated = true; // テーブル作成フラグを立てる

      const contentDiv = document.getElementById('content');
      const table = document.createElement('table');
      table.setAttribute('cellpadding', '0');
      table.setAttribute('cellspacing', '0');
      table.setAttribute('border', '0');
      table.setAttribute('align', 'left');

      for (const [id, link] of Object.entries(links)) {
        const row = document.createElement('tr');
        row.setAttribute('class', 'list');
        row.setAttribute('id', id);
        row.setAttribute('onclick', `changeLink('${id}')`);

        const imgCell = document.createElement('td');
        imgCell.setAttribute('valign', 'top');
        imgCell.setAttribute('class', 'img');
        const img = document.createElement('img');
        img.setAttribute('src', `https://img.youtube.com/vi/${link.url.split('v=')[1]}/hqdefault.jpg`);
        imgCell.appendChild(img);

        const descriptionCell = document.createElement('td');
       // descriptionCell.setAttribute('width', '250');
        descriptionCell.setAttribute('valign', 'top');
        descriptionCell.setAttribute('class', 'text');
        descriptionCell.innerHTML = link.description; // 説明を設定 (innerHTMLを使用)

        row.appendChild(imgCell);
        row.appendChild(descriptionCell);
        table.appendChild(row);
      }

      contentDiv.appendChild(table);
      document.querySelector('.loader').style.zIndex = '-999999'; // ロード画面のz-indexを変更
      document.body.style.overflow = 'auto'; // スクロールを有効に
      document.querySelector('.menu').style.display = 'flex'; // ロード画面のz-indexを変更
    }

function displayText() {
  const loader = document.querySelector('.loader');
  const loaderVideo = document.getElementById('loaderVideo');
  const menu = document.querySelector('.menu');
  loader.style.display = 'block'; // ローダーを表示
  menu.style.display = 'none'; // ローダーを表示
  document.body.style.overflow = 'hidden'; // スクロールを禁止
  loaderVideo.onended = function() {
    loader.style.display = 'none'; // ローダーを非表示にする
    
    document.body.style.overflow = 'auto'; // スクロールを再度有効に
    createTable(); // テーブルを作成
    switchSlide2();
  };
}

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[mobile]オリジナル曲　－　ライフガード</title>
  <meta name="description" content="モバイル版サイト、ライフガードのオリジナルをまとめたサイトです。ただし更新が遅いです。PCはhttps://akaina0112.github.io/music/pc.htmlです。">
  <style type="text/css">
    /* モーダルスタイル */
    #confirmationModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid #ccc;
      padding: 20px;
      z-index: 1000;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    #confirmationModal button {
      margin: 5px;
    }

    html {
      font-family: 'akaina', sans-serif; /* フォントの適用 */
    }
    video {
      pointer-events: none; /* ビデオに対するすべてのポインターイベントを無効化 */
    }
    img {
      pointer-events: none; /* 画像に対するすべてのポインターイベントを無効化 */
    }
    .text {
      font-family: 'akaina', sans-serif; /* フォントの適用 */
      background-color: rgba(255, 255, 255, 0.8); /* 半透明の白背景 */
      padding: 10px; /* 内側の余白 */
      width: 50% !important;
      height: 100px !important;
      border-radius: 5px; /* 角を丸く */
      font-weight: bold; /* 太字 */
      text-align: left; /* 左揃え */
      box-sizing: border-box; /* パディングを含めたサイズ */
      overflow: hidden; /* オーバーフロー防止 */
    }

    @font-face {
      font-family: 'akaina';
      src: url('fonts/setofont.ttf') format('truetype'),
           url('fonts/setofont-ex.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      margin: 0;
      height: 100%;
      overflow: hidden; /* スクロールを無効に */
    }
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .content {
      margin: 20px;
      overflow: auto; /* コンテンツがはみ出た場合にスクロール可能にする */
    }
    .img img {
      opacity: 0.7;
      max-width: 100%; /* 画像を親要素に合わせる */
      height: auto; /* 高さを自動調整 */
    }
    .highlight {
      color: #e6b422;
      text-shadow: 0 0 1.6px #e6b422,0 0 5px #000;
      padding: 20px;
      text-align: center;
      letter-spacing: 0.1em;
    }
    .color-red {
      color: #a200f2;
      text-shadow: 0 0 10px #a200f2,0 0 15px #a200f2;
      padding: 20px;
      text-align: center;
      letter-spacing: 0.2em;
    }
    .n {
      display: block;
    }
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.8);
      z-index: 100;
      color: #333;
      transition: top 0.5s;
      flex-direction: column;
      padding-bottom: 30px;
    }
    .loader-video {
      z-index: 999999999;
      width: 100%; /* 幅を100%に設定 */
      height: 100%; /* 高さを100%に設定 */
      object-fit: cover; /* アスペクト比を維持しつつ、画面全体を覆う */
    }
    .loader p {
      font-size: 20px;
      margin: 0;
    }

    /* モバイルスタイル */
    @media (max-width: 768px) {
      .text {
        font-size: 16px; /* テキストサイズを調整 */
      }
      .loader p {
        font-size: 16px; /* ローダーのテキストサイズも調整 */
      }
    }
    .menu {
      position: fixed;
      bottom: 20px;
      right: 20px;
      flex-direction: column;
      width: 50px;
      height: 50px;
      background-color: #fff;
      border-radius: 50%;
      cursor: pointer;
      z-index: 200;
      transition: transform 250ms ease;
    }
    .menu span {
      display: block;
      width: 100%;
      height: 5px;
      background-color: #444;
      margin: 5px 0;
      transition: transform 250ms ease;
    }
    #menu {
      display: none;
    }
    #menu:checked ~ .menu {
      background-color: transparent;
      transform: rotate(360deg);
    }
    #menu:checked ~ .menu span:nth-of-type(1) {
      transform: translateY(10px) rotate(45deg);
    }
    #menu:checked ~ .menu span:nth-of-type(2) {
      display: none;
    }
    #menu:checked ~ .menu span:nth-of-type(3) {
      transform: translateY(-10px) rotate(-45deg);
    }
    .nav {
      position: fixed;
      top: -100px;
      left: 0;
      width: 100%;
      height: 100px;
      background-color: rgba(255, 255, 255, .8);
      transition: top 250ms ease;
      z-index: 100;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    #menu:checked ~ .nav {
      top: 0;
    }
    .nav ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: space-around;
      width: 100%;
    }
    .nav li {
      padding: 15px 20px;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
    }
    .nav li:hover {
      color: #cc2e72;
      text-shadow: 0 0 10px #cc2e72, 0 0 15px #cc2e72;
      padding: 20px;
      text-align: center;
      letter-spacing: .2em;
    }
  </style>
  <script>
    const links = {
      "row1": {
        url: "https://www.youtube.com/watch?v=OMp9s9f4cnI",
        description: "<span class='n'><h2>君と出会えた奇跡 / ライフガード</h2></span><h3><span class='n'>この曲は出会えたことに感謝していることを表しています。</span><span class='n'>君にというのは出逢えた人たちの事です。</span><span class='n'>ちなみに出逢えたは本来出会えたです。わざと出逢えたにしております。</span><span class='n'><span class='highlight'>公開日:2024/09/04</span></span></h3>"
      },
      "row2": {
        url: "https://www.youtube.com/watch?v=AkYCR-N9hbY",
        description: "<span class='n'><h2>君の笑顔に心が奪われる</h2></span><h3><span class='n'>この曲は恋愛が元になっております。</span><span class='n'>私は男性女性関係なく恋愛します。</span><span class='n'>笑顔に心が奪われるは見惚れてしまうということです。</span><span class='n'><span class='highlight'>公開日:2024/09/17</span></span></h3>"
      },
      "row3": {
        url: "https://www.youtube.com/watch?v=VJ9xUEWChWs",
        description: "<span class='n'><h2>君と一緒に過ごす時間</h2></span><h3><span class='n'>この曲は一緒に過ごした時間を感謝する意味を込めています。</span><span class='n'>一緒に過ごせた時間は本当に幸せでした。</span><span class='n'><span class='highlight'>公開日:2024/09/26</span></span></h3>"
      }
    };

    function changeLink(rowId) {
      var modalContent = document.getElementById('modalContent');
      var modalLink = document.getElementById('modalLink');
      modalContent.innerHTML = links[rowId].description;
      modalLink.href = links[rowId].url;
      document.getElementById('confirmationModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('confirmationModal').style.display = 'none';
    }
  </script>
</head>
<body>
  <!-- 背景動画 -->
  <video class="bg-video" autoplay muted loop>
    <source src="https://akaina0112.github.io/Test/bgm.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- ローダー -->
  <div class="loader">
    <div class="loader-video">
      <video autoplay muted loop>
        <source src="https://akaina0112.github.io/Test/loader.mp4" type="video/mp4">
      </video>
    </div>
    <p>読み込み中...</p>
  </div>

  <!-- メニュー -->
  <div class="menu" onclick="document.getElementById('menu').checked = !document.getElementById('menu').checked;">
    <span></span><span></span><span></span>
  </div>
  <input type="checkbox" id="menu">
  <nav class="nav">
    <ul>
      <li><a href="#">メニュー1</a></li>
      <li><a href="#">メニュー2</a></li>
      <li><a href="#">メニュー3</a></li>
    </ul>
  </nav>

  <!-- コンテンツ -->
  <div class="content">
    <div class="highlight">
      <h1>ライフガード オリジナル曲</h1>
    </div>
    <div class="text">
      <button onclick="changeLink('row1')">君と出会えた奇跡</button>
      <button onclick="changeLink('row2')">君の笑顔に心が奪われる</button>
      <button onclick="changeLink('row3')">君と一緒に過ごす時間</button>
    </div>
  </div>

  <!-- モーダル -->
  <div id="confirmationModal">
    <div id="modalContent"></div>
    <a id="modalLink" target="_blank">
      <button>リンクを開く</button>
    </a>
    <button onclick="closeModal()">閉じる</button>
  </div>
</body>
</html>
